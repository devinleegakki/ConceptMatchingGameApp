name: Android APK Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release APK
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build ARM64 APK
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          FLET_CLI_LOG_FORMAT: plain
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: .\scripts\build_android_release.ps1

      - name: Prepare release assets
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $apk = Get-ChildItem -LiteralPath "build\apk" -File -Filter "*.apk" | Select-Object -First 1
          if ($null -eq $apk) {
            throw "No APK was produced in build\apk"
          }

          $releaseName = "concept_matching_game-$env:RELEASE_TAG-arm64-v8a.apk"
          $releasePath = Join-Path $apk.DirectoryName $releaseName
          Copy-Item -LiteralPath $apk.FullName -Destination $releasePath -Force

          $hash = (Get-FileHash -LiteralPath $releasePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$releasePath.sha256"
          "$hash  $releaseName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "apk=$releasePath" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Concept Matching Game ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ARM64 Android APK for `${{ github.ref_name }}`.

            This is an unsigned test build intended for internal testing.

            Assets include a SHA-256 checksum for download verification.
          files: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.checksum }}
